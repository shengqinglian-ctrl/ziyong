services:
  backend:
    build:
      context: ./backend
    environment:
      ASW_DATABASE_URL: sqlite:////app/data/a_stock_watcher.db
      ASW_CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-data:
